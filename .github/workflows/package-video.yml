name: package-video
# Extracts the critical windows of the Video-v1 release asset at FULL
# quality (no downscale, CRF 14) so faint fast-moving objects survive,
# splits into <95 MB parts, and pushes them to the branch `video-hq`.
on:
  workflow_dispatch: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download Video-v1 --pattern '*.mov' \
            --output original.mov --repo "$GITHUB_REPOSITORY"
          ls -la original.mov
      - name: Probe and extract HQ windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,nb_frames,duration,codec_name \
            -of default=noprint_wrappers=1 original.mov | tee probe.txt
          # Full-resolution windows: rounds A/B and the final spin C.
          ffmpeg -y -ss 60 -to 100 -i original.mov -c:v libx264 \
            -preset slow -crf 14 -profile:v main -pix_fmt yuv420p -an hq_060_100.mp4
          ffmpeg -y -ss 100 -to 135 -i original.mov -c:v libx264 \
            -preset slow -crf 14 -profile:v main -pix_fmt yuv420p -an hq_100_135.mp4
          ffmpeg -y -ss 25 -to 56 -i original.mov -c:v libx264 \
            -preset slow -crf 14 -profile:v main -pix_fmt yuv420p -an hq_025_056.mp4
          ffmpeg -y -ss 145 -to 192 -i original.mov -c:v libx264 \
            -preset slow -crf 14 -profile:v main -pix_fmt yuv420p -an hq_145_192.mp4
          ffmpeg -y -ss 192 -to 237.4 -i original.mov -c:v libx264 \
            -preset slow -crf 14 -profile:v main -pix_fmt yuv420p -an hq_192_237.mp4
          ls -la hq_*.mp4
      - name: Split and push chunks branch
        run: |
          mkdir -p chunks
          cp probe.txt chunks/
          for f in hq_*.mp4; do
            split -b 95m -d "$f" "chunks/$f.part."
          done
          sha256sum hq_*.mp4 chunks/* > chunks/SHA256SUMS || true
          ls -la chunks
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan video-hq
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f chunks
          git commit -m "full-quality windows from release Video-v1"
          git push -f origin video-hq
