[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prophetvision"
version = "0.1.0"
description = "Physics-informed ball landing zone prediction from video"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.scripts]
prophetvision = "prophetvision.cli:main"

[tool.setuptools.packages.find]
include = ["prophetvision*"]
